name: Publish to NuGet

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build]
    branches: [master]
    types: [completed]

env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  PACKAGE_OUTPUT: artifacts/packages

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    # Only a successful Build of a push to master publishes: a pull_request Build (including one from a fork's own
    # 'master' branch) never reaches the NuGet key.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') }}
    permissions:
      contents: write
    env:
      # The commit the triggering Build tested; a manual run publishes the commit it was started on.
      PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PUBLISH_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The shared version lives in Directory.Build.props so every packable project
      # under src/ ships with the same version number.
      - name: Read version from Directory.Build.props
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -n 1 | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "::error::No <Version> element found in Directory.Build.props."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $VERSION"

      - name: Check whether release tag already exists
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists; the GitHub Release step will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Every project under src/ is packed; projects that set IsPackable=false produce nothing.
      - name: Pack all packable projects under src/
        shell: bash
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            echo "Packing $project"
            dotnet pack "$project" --configuration Release --no-build --output "$PACKAGE_OUTPUT"
          done
          echo "Packages produced:"
          ls -1 "$PACKAGE_OUTPUT"/*.nupkg

      - name: Push packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "$PACKAGE_OUTPUT/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "$NUGET_SOURCE" \
            --skip-duplicate

      # The release body is only this version's CHANGELOG section, not the whole history.
      - name: Extract this version's release notes
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '/^## \[/{ if (f) exit; if (index($0, "## [" version "]") == 1) f=1 } f' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.exists == 'false'
        with:
          name: Release v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ env.PUBLISH_SHA }}
          body_path: release-notes.md
          generate_release_notes: false
          files: artifacts/packages/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  on-failure:
    name: Build Failed
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Report failure
        run: |
          echo "::error::Build workflow failed. NuGet publish skipped."
          exit 1
